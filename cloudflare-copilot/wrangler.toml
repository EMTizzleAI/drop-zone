name = "emtizzle-dropzone-copilot"
main = "src/index.js"
compatibility_date = "2026-10-27"
workers_dev = true

[ai]
binding = "AI"

# Limits are approximate per Cloudflare edge location, not strict global quotas.
# Stay on Workers Free to avoid usage-based charges beyond free allocation.
[[ratelimits]]
name = "COPILOT_GLOBAL_RATE"
namespace_id = "1027271"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "COPILOT_VISITOR_RATE"
namespace_id = "1027272"
  [ratelimits.simple]
  limit = 8
  period = 60
