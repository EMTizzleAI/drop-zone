 <linearGradient id="charm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93fff4"/><stop offset="1" stop-color="#fd8ddd"/></linearGradient>
 <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="3.4"/></filter>
