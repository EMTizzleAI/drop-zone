<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="llamaTitle llamaDesc">
<title id="llamaTitle">No Drama Llama</title><desc id="llamaDesc">A very fluffy snowy-white cartoon llama with pink cheeks, lavender hooves and a tiny protective heart amulet, bounding playfully.</desc>
<defs>
 <radialGradient id="fleece" cx="35%" cy="26%" r="80%"><stop stop-color="#fffefa"/><stop offset=".66" stop-color="#fff7ff"/><stop offset="1" stop-color="#ddd3f6"/></radialGradient>
