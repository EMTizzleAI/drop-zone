<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Manager // EMTizzle</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#090915;color:#fff;font:16px/1.5 system-ui;margin:0}main{max-width:680px;margin:auto;padding:20px 16px 70px}h1{color:#ff49ad}a{color:#ff9bcd}.card{background:#19192b;border:1px solid #47405b;border-radius:18px;padding:18px;margin:15px 0}label{display:grid;gap:5px;margin:12px 0}input,textarea,select,button{font:inherit;border-radius:10px;padding:12px;width:100%}input,textarea,select{background:#101020;color:#fff;border:1px solid #766d87}button{background:#ff49ad;border:0;color:#21091b;font-weight:800;cursor:pointer;min-height:48px}button.secondary{background:#303047;color:white}button.danger{background:#b93d5e;color:white}.hidden{display:none}small,.note{color:#c2b8cf}button:focus-visible,input:focus-visible{outline:3px solid #ffe37b}</style></head><body><main><a href="stabilization.html">← Public navigator</a><h1>🩷 Resource Manager</h1><p>Private EMTizzle editor. Only approved admin accounts can publish listings. Never put passwords or secret keys in repository files.</p><p id="status" role="status"></p>
<section id="login" class="card"><h2>Admin sign-in</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">SIGN IN</button></section>
<section id="editor" class="hidden"><button class="secondary" id="signOut">Sign out</button><div class="card"><h2 id="formTitle">Add a resource</h2><form id="resourceForm"><label>Resource name *<input name="name" required maxlength="160"></label><label>Category *<select name="category" required><option value="insurance">Health insurance</option><option value="injury">Injury care</option><option value="sick">Medical clinic</option><option value="dental">Dental</option><option value="medication">Medication</option><option value="food">Food</option><option value="housing">Housing</option><option value="benefits">Social services</option><option value="mental">Mental health</option><option value="other">Other</option></select></label><label>State abbreviation *<input name="state" maxlength="2" value="CA" required></label><label>City<input name="city" maxlength="100"></label><label>Street address<input name="address" maxlength="250"></label><label>Phone<input name="phone" type="tel" maxlength="40"></label><label>Website<input name="website" type="url" placeholder="https://" maxlength="500"></label><label>What they offer<textarea name="description" rows="3" maxlength="1500"></textarea></label><label>Eligibility<textarea name="eligibility" rows="2" maxlength="800"></textarea></label><label>Costs / free services<input name="cost" maxlength="250"></label><label>Hours<input name="hours" maxlength="250"></label><label>Last personally checked<input name="verified_on" type="date"></label><label><input name="field_verified" type="checkbox" style="width:auto"> I personally verified this listing</label><label><input name="published" type="checkbox" style="width:auto"> Publish publicly</label><button type="submit">SAVE RESOURCE</button><button id="clearForm" class="secondary" type="button">New blank resource</button></form></div><div class="card"><h2>My resource listings</h2><div id="listing"></div></div></section>
</main><script src="resource-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const cfg=window.DZ_RESOURCE_CONFIG||{},status=document.getElementById('status'),login=document.getElementById('login'),editor=document.getElementById('editor'),form=document.getElementById('resourceForm');const client=cfg.url&&cfg.publishableKey&&window.supabase?window.supabase.createClient(cfg.url,cfg.publishableKey):null;let editing=null,items=[];
function say(t){status.textContent=t}function clear(){editing=null;form.reset();form.elements.state.value='CA';document.getElementById('formTitle').textContent='Add a resource'}document.getElementById('clearForm').onclick=clear;
async function refresh(){if(!client)return;const {data,error}=await client.from('dz_resources').select('*').order('updated_at',{ascending:false});if(error){say('Unable to read resources: '+error.message);return}items=data||[];const listing=document.getElementById('listing');listing.replaceChildren();items.forEach(r=>{const div=document.createElement('div');div.style.padding='12px 0';div.style.borderBottom='1px solid #555';const name=document.createElement('strong');name.textContent=r.name+' — '+r.city+' '+r.state+(r.published?' • LIVE':' • DRAFT');const edit=document.createElement('button');edit.textContent='EDIT';edit.className='secondary';edit.onclick=()=>{editing=r.id;for(const [key,val] of Object.entries(r)){const el=form.elements.namedItem(key);if(!el)continue;if(el.type==='checkbox')el.checked=!!val;else el.value=val??''}document.getElementById('formTitle').textContent='Edit resource';window.scrollTo(0,0)};const del=document.createElement('button');del.textContent='DELETE';del.className='danger';del.onclick=async()=>{if(!confirm('Delete this resource permanently?'))return;const {error}=await client.from('dz_resources').delete().eq('id',r.id);say(error?'Delete failed: '+error.message:'Resource deleted');if(!error)refresh()};div.append(name,edit,del);listing.append(div)})}
async function authenticate(){if(!client){say('Not connected yet. Configure resource-config.js and apply the database SQL first.');return}const {data,error}=await client.auth.getUser();if(error||!data.user){login.classList.remove('hidden');editor.classList.add('hidden');return}const {data:admin,error:adminError}=await client.from('dz_admins').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){say('Signed in, but this account is not an approved resource editor.');await client.auth.signOut();login.classList.remove('hidden');editor.classList.add('hidden');return}login.classList.add('hidden');editor.classList.remove('hidden');say('Authorized editor signed in.');refresh()}
document.getElementById('signIn').onclick=async()=>{if(!client){say('Database not configured.');return}const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('password').value='';if(error)say('Sign-in failed: '+error.message);else authenticate()};
document.getElementById('signOut').onclick=async()=>{await client.auth.signOut();login.classList.remove('hidden');editor.classList.add('hidden');say('Signed out')};
form.onsubmit=async e=>{e.preventDefault();if(!client)return;const f=new FormData(form),fields=['name','category','state','city','address','phone','website','description','eligibility','cost','hours','verified_on'];const row={};fields.forEach(k=>row[k]=String(f.get(k)||'').trim()||null);row.state=(row.state||'').toUpperCase();row.published=f.has('published');row.field_verified=f.has('field_verified');if(row.field_verified&&!row.verified_on){say('Choose a verification date before marking field verified.');return}if(row.website&&!/^https:\/\//i.test(row.website)){say('Website must use HTTPS.');return}let result=editing?await client.from('dz_resources').update(row).eq('id',editing):await client.from('dz_resources').insert(row);if(result.error){say('Save failed: '+result.error.message);return}say('Resource saved.');clear();refresh()};
authenticate();
</script></body></html>
