name: Job Goblin Cloud (private vault)

on:
  schedule:
    - cron: '0 18 * * *' # 10 AM PST / 11 AM PDT
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview or send eligible applications'
        type: choice
        options: [preview, apply]
        default: preview
        required: true

permissions:
  contents: write

concurrency:
  group: job-goblin-cloud
  cancel-in-progress: false

jobs:
  goblin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check that owner enabled private vault
        id: secret
        shell: bash
        env:
          VAULT_KEY: ${{ secrets.GOBLIN_VAULT_KEY }}
        run: |
          if [[ -z "$VAULT_KEY" ]]; then
            echo "Missing GOBLIN_VAULT_KEY. No personal information decrypted; no applications sent."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout reviewed application code
        if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: app
          persist-credentials: false
      - name: Checkout encrypted ledger branch
        if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: job-goblin-state
          path: state
          persist-credentials: true
      - name: Set up Python
        if: steps.secret.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install browser environment
        if: steps.secret.outputs.ready == 'true'
        run: |
          python -m pip install 'playwright==1.55.0' 'cryptography==46.0.4'
          python -m playwright install --with-deps chromium
      - name: Test job discovery safety and resume routing
        if: steps.secret.outputs.ready == 'true'
        env:
          PYTHONPATH: app/job-goblin-autopilot
        run: python -m unittest discover -s app/job-goblin-autopilot/tests -v
      - name: Run encrypted cloud applicant
        if: steps.secret.outputs.ready == 'true'
        shell: bash
        env:
          GOBLIN_VAULT_KEY: ${{ secrets.GOBLIN_VAULT_KEY }}
          EVENT_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          mode=apply
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${EVENT_MODE:-preview}"
          fi
          python app/job-goblin-autopilot/cloud_runner.py \
            --vault app/job-goblin-autopilot/cloud_vault.b64 \
            --ledger state/ledger.b64 \
            --agent-dir app/job-goblin-autopilot \
            --mode "$mode"
